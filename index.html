anslateY(12px)}to{opacity:1;transform:none}}@keyframes splash-fade{0%{opacity:0}to{opacity:1}}@media (prefers-reduced-motion:reduce){.splash-ring{display:none}.splash-halo,.splash-word,.splash-bar,.splash-bar i{animation:none}#splash{transition:none}}</style>
